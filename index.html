<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PC Hub</title>
<meta name="theme-color" content="#f6f8ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PC Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <nav id="nav" aria-label="メインメニュー"></nav>
  <div id="main">
    <main id="view"></main>
  </div>
</div>

<!-- 詳細 -->
<dialog id="dlgDetail" class="sheet"></dialog>

<!-- 追加・編集 -->
<dialog id="dlgForm" class="sheet">
  <form id="form" method="dialog" autocomplete="off">
    <header class="sheet-bar">
      <button type="button" class="icon-btn" data-act="close" aria-label="閉じる"><span class="ms">close</span></button>
      <h2 id="formTitle">PCを追加</h2>
      <button type="submit" class="btn filled"><span class="ms">check</span>保存</button>
    </header>
    <div class="sheet-body">
      <section class="fsec">
        <h3><span class="ms">photo_camera</span>写真 <small>（最大4枚・先頭がカードに表示）</small></h3>
        <div class="photo-strip" id="photoStrip"></div>
      </section>

      <section class="fsec">
        <h3><span class="ms">badge</span>基本情報</h3>
        <div class="fgrid">
          <label class="tf"><span>管理番号 *</span><input name="no" required placeholder="PC-001"></label>
          <label class="tf"><span>呼び名</span><input name="nick" placeholder="部室の黒いノート"></label>
          <label class="tf"><span>種類</span><select name="kind"></select></label>
          <label class="tf"><span>メーカー *</span><select name="maker" id="fMakerSel"></select></label>
          <label class="tf" id="makerOtherWrap" hidden><span>メーカー名（その他）</span><input name="makerOther"></label>
          <label class="tf wide"><span>モデル名</span><input name="model" placeholder="ThinkPad L13 / Latitude 3410 / ProBook 450 G8"></label>
        </div>
      </section>

      <section class="fsec">
        <h3><span class="ms">memory</span>OS・スペック</h3>
        <div class="detect-row"><button type="button" class="btn tonal" data-act="detect"><span class="ms">sensors</span>いま使っているPCから読み取る</button><small>PCのブラウザで開いたときに使えます（メモリは目安）</small></div>
        <div class="fgrid">
          <label class="tf"><span>OS *</span><select name="os" id="fOSSel"></select></label>
          <label class="tf" id="osOtherWrap" hidden><span>OS名（その他）</span><input name="osOther"></label>
          <label class="tf"><span>OSバージョン</span><input name="osVer" list="osVerList" placeholder="24H2 / 22H2 / 17.1 / 130"></label>
          <datalist id="osVerList"><option value="25H2"><option value="24H2"><option value="23H2"><option value="22H2"><option value="21H2"></datalist>
          <label class="tf wide"><span>CPU</span><input name="cpu" placeholder="Core i5-1135G7 / Ryzen 5 5500U"></label>
          <label class="tf"><span>メモリ (GB)</span><input name="ram" type="number" min="0" step="1" inputmode="numeric"></label>
          <label class="tf"><span>ストレージ容量 (GB)</span><input name="storage" type="number" min="0" step="1" inputmode="numeric" placeholder="256 / 512 / 1000"></label>
          <label class="tf"><span>ストレージ種類</span><select name="storageType"><option>SSD</option><option>NVMe SSD</option><option>HDD</option><option>eMMC</option><option>不明</option></select></label>
          <label class="tf"><span>画面サイズ (インチ)</span><input name="screen" inputmode="decimal" placeholder="13.3"></label>
        </div>
      </section>

      <section class="fsec">
        <h3><span class="ms">inventory_2</span>管理情報</h3>
        <div class="fgrid">
          <label class="tf"><span>状態</span><select name="status"></select></label>
          <label class="tf"><span>設置場所</span><input name="place" placeholder="PC室 棚A"></label>
          <label class="tf"><span>導入年</span><input name="year" type="number" min="1990" max="2100" inputmode="numeric" placeholder="2021"></label>
          <label class="tf"><span>保証期限</span><input name="warrantyEnd" type="date"></label>
          <label class="tf"><span>最終点検日</span><input name="lastCheck" type="date"></label>
          <label class="tf"><span>シリアル番号</span><input name="serial"></label>
          <label class="tf"><span>ホスト名</span><input name="host" placeholder="PC-CLUB-01"></label>
          <label class="tf"><span>MACアドレス</span><input name="mac" placeholder="AA:BB:CC:DD:EE:FF"></label>
          <label class="tf wide"><span>付属品</span><input name="accessories" placeholder="ACアダプタ、マウス、ケース"></label>
          <label class="tf"><span>購入金額 (円)</span><input name="price" type="number" min="0" step="1" inputmode="numeric" placeholder="98000"></label>
          <label class="tf"><span>タグ（カンマ区切り）</span><input name="tags" placeholder="プログラミング用, 大会用"></label>
          <label class="tf wide"><span>インストール済みソフト（カンマ区切り）</span><input name="software" placeholder="VS Code, Python, Blender"></label>
          <label class="tf wide"><span>備考</span><textarea name="memo" rows="3" placeholder="バッテリー劣化、ログイン方法、注意点など"></textarea></label>
        </div>
      </section>
      <div class="sheet-foot"><button type="button" class="btn danger tonal" id="btnDelete" hidden><span class="ms">delete</span>このPCを削除</button></div>
    </div>
  </form>
  <input type="file" id="photoInput" accept="image/*" multiple hidden>
</dialog>

<!-- 貸出 -->
<dialog id="dlgLoan" class="modal">
  <form id="loanForm" method="dialog" autocomplete="off">
    <span class="ms hero-ic">handshake</span>
    <h2>貸し出す</h2>
    <p class="sub" id="loanTarget"></p>
    <label class="tf"><span>借りる人 *</span><input name="who" required list="whoList" placeholder="例: 2年 山田さん"></label><datalist id="whoList"></datalist>
    <label class="tf"><span>返却予定日</span><input name="due" type="date"></label>
    <div class="chip-row">
      <button type="button" class="chip" data-act="due" data-days="1">明日</button>
      <button type="button" class="chip" data-act="due" data-days="3">3日後</button>
      <button type="button" class="chip" data-act="due" data-days="7">1週間後</button>
      <button type="button" class="chip" data-act="due" data-days="14">2週間後</button>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn text" data-act="close">キャンセル</button>
      <button type="submit" class="btn filled">貸し出す</button>
    </div>
  </form>
</dialog>

<div id="selbar" class="selbar" hidden></div>
<dialog id="dlgCompare" class="sheet"></dialog>
<input type="file" id="csvInput" accept=".csv,text/csv" hidden>
<div id="snack" class="snack" hidden><span id="snackMsg"></span><button id="snackAct" class="btn text"></button></div>
<div id="printArea"></div>
<input type="file" id="importInput" accept="application/json,.json" hidden>
<script src="app.js"></script>
</body>
</html>
